# Multi-Modal RAG Assistant - Master Configuration
# =================================================
# All tunables for the document intelligence pipeline.

app:
  name: "multimodal-rag-assistant"
  version: "1.0.0"
  log_level: "INFO"

paths:
  data_dir: "./data"
  vector_store_dir: "./data/chroma"
  uploads_dir: "./data/uploads"
  cache_dir: "./data/cache"

ingestion:
  pdf:
    library: "pypdf"          # pypdf | pymupdf
    extract_images: false
    max_pages: 0              # 0 = all
  image:
    ocr_engine: "pytesseract" # pytesseract | easyocr
    languages: ["eng"]
    preprocess: true          # grayscale + contrast enhancement
    min_confidence: 30
  text:
    encoding: "utf-8"
    extensions: [".txt", ".md"]

processing:
  chunker:
    strategy: "recursive"     # recursive | fixed | sentence
    chunk_size: 256
    chunk_overlap: 48
    separators: ["\n\n", "\n", ". ", " ", ""]
  embedder:
    model_name: "sentence-transformers/all-mpnet-base-v2"
    device: "cpu"             # cpu | cuda | mps
    normalize: true
    batch_size: 32
    cache: true

retrieval:
  vector_store:
    backend: "chromadb"
    collection_name: "documents"
    distance_metric: "cosine"
    persist: true
  retriever:
    top_k: 10
    score_threshold: 0.0      # 0 = no threshold; higher = stricter
    hybrid_weight: 0.5        # 0 = dense only; 0.5 = blend dense + keyword coverage
    rerank: false

generation:
  llm:
    provider: "local"         # local | openai | anthropic | gemini (env LLM_PROVIDER overrides)
    model_name: "gemini-2.5-flash"   # gemini-2.5-flash | gemini-flash-latest | gemini-2.5-pro
    max_new_tokens: 1024
    temperature: 0.2
    device: "cpu"
  prompt:
    template: |
      You are a helpful document assistant. Use ONLY the context below
      to answer the question. If the context contains relevant information,
      answer based on it even if it is partial — do not refuse to answer
      merely because the context is a fragment. Only if the context
      contains nothing relevant to the question, say
      "I don't have enough information in the provided documents."

      Context:
      {context}

      Question: {question}

      Answer:

evaluation:
  metrics:
    - retrieval_precision_at_k
    - retrieval_recall_at_k
    - answer_relevance
    - answer_faithfulness
  test_set: "./tests/eval_dataset.json"

streamlit:
  page_title: "Multi-Modal RAG Assistant"
  page_icon: ":brain:"
  layout: "wide"
  theme: "light"